    fx+=((nx-.5)*-3-fx)*.01;fy+=((ny-.5)*-2.4-fy)*.01;      // el fondo se mueve poco y al revés
    fondo.style.transform='translate('+fx.toFixed(3)+'%,'+fy.toFixed(3)+'%) scale(1.04)';
    // un velo al centro para que la frase respire
    sombra.style.background='radial-gradient(40% 30% at 50% 50%,'+hexA(l.f[0],.55)+',transparent 100%),radial-gradient(60% 60% at '+(lx*100).toFixed(1)+'% '+(ly*100).toFixed(1)+'%,'+hexA(l.f[1],.12)+','+hexA(l.f[0],.78)+' 75%)';
    requestAnimationFrame(bucle);
  }
  window.addEventListener('resize',function(){clearTimeout(window._t);window._t=setTimeout(tamano,200)});
  tamano();lente(0);
  if(reducido){for(var t=0;t<300;t++)band.paso();sombra.style.background='radial-gradient(60% 60% at 50% 50%,rgba(6,11,24,.4),rgba(6,11,24,.85))';band.dibuja(ctx,L[0].p)}
  else requestAnimationFrame(bucle);
})();
</script>
</body>
</html>
